# SmartGen HSC941 Generator Controller - ESP32-P4 Waveshare 10.1" Display
# ESPHome configuration for LVGL touchscreen interface over RS485
#
# Board: ESP32-P4 with MIPI DSI 1024x600 display, GT911 touch, ESP32-C6 WiFi

substitutions:
  device_name: smartgen-hsc941-display
  friendly_name: "Generator"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-p4-evboard
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# WiFi via ESP32-C6 co-processor (SDIO)
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

# I2C bus for touchscreen
i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8

# LDO for MIPI DSI PHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# Load the SmartGen HSC941 component from local directory
external_components:
  - source:
      type: local
      path: components

# ============================================================
#  MIPI DSI Display (Waveshare 10.1" 1024x600)
# ============================================================
display:
  - platform: mipi_dsi
    dimensions:
      width: 1024
      height: 600
    hsync_pulse_width: 40
    hsync_front_porch: 40
    hsync_back_porch: 140
    vsync_pulse_width: 4
    vsync_front_porch: 16
    vsync_back_porch: 16
    id: my_display
    model: WAVESHARE-P4-NANO-10.1
    reset_pin: GPIO33
    init_sequence:
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11]
      - delay 120ms

# ============================================================
#  GT911 Capacitive Touchscreen
# ============================================================
touchscreen:
  - platform: gt911
    id: my_touchscreen

# ============================================================
#  Backlight (LEDC PWM)
# ============================================================
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# ============================================================
#  SmartGen HSC941 Controller Hub (RS485)
# ============================================================
smartgen_hsc941:
  id: genset
  address: 1
  baud_rate: 9600
  tx_pin: GPIO26
  rx_pin: GPIO27
  uart_num: 1
  update_interval: 5s

# ============================================================
#  Sensors (platform: smartgen_hsc941)
#  IDs are for LVGL widget binding in later tasks
# ============================================================
sensor:
  - platform: smartgen_hsc941
    smartgen_hsc941_id: genset

    gen_voltage_a:
      name: "${friendly_name} Voltage"
      id: sen_voltage
      on_value:
        then:
          - lvgl.arc.update:
              id: arc_voltage
              value: !lambda return (int)x;
          - lvgl.label.update:
              id: lbl_voltage_val
              text: !lambda |-
                char buf[8];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return std::string(buf);
    gen_frequency:
      name: "${friendly_name} Frequency"
      id: sen_frequency
      on_value:
        then:
          - lvgl.arc.update:
              id: arc_frequency
              value: !lambda return (int)(x * 100);
          - lvgl.label.update:
              id: lbl_freq_val
              text: !lambda |-
                char buf[8];
                snprintf(buf, sizeof(buf), "%.1f", x);
                return std::string(buf);
    engine_speed:
      name: "${friendly_name} Engine Speed"
      id: sen_rpm
      on_value:
        then:
          - lvgl.arc.update:
              id: arc_rpm
              value: !lambda return (int)x;
          - lvgl.label.update:
              id: lbl_rpm_val
              text: !lambda |-
                char buf[8];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return std::string(buf);
    output_load_percent:
      name: "${friendly_name} Output Load"
      id: sen_load
      on_value:
        then:
          - lvgl.arc.update:
              id: arc_load
              value: !lambda return (int)x;
          - lvgl.label.update:
              id: lbl_load_val
              text: !lambda |-
                char buf[8];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return std::string(buf);
    water_temperature:
      name: "${friendly_name} Coolant Temperature"
      id: sen_water_temp
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_wt
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), "%.0f °C", x);
                return std::string(buf);
    oil_pressure:
      name: "${friendly_name} Oil Pressure"
      id: sen_oil_pressure
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_op
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), "%.0f kPa", x);
                return std::string(buf);
    battery_voltage:
      name: "${friendly_name} Battery Voltage"
      id: sen_battery
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_batt
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), "%.1f V", x);
                return std::string(buf);
    charge_voltage:
      name: "${friendly_name} D+ Charge Voltage"
      id: sen_charge
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_chg
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), "%.1f V", x);
                return std::string(buf);
    engine_total_hours:
      name: "${friendly_name} Total Running Hours"
      id: sen_total_hours
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_hours
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), "%.0f h", x);
                return std::string(buf);
    total_start_times:
      name: "${friendly_name} Total Starts"
      id: sen_total_starts
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_starts
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return std::string(buf);
    total_active_power:
      name: "${friendly_name} Total Active Power"
      id: sen_power
    power_factor:
      name: "${friendly_name} Power Factor"
      id: sen_pf

# ============================================================
#  Binary Sensors (platform: smartgen_hsc941)
#  IDs are for LVGL indicator binding in later tasks
# ============================================================
binary_sensor:
  - platform: smartgen_hsc941
    smartgen_hsc941_id: genset

    # --- Summary Alarms ---
    common_alarm:
      name: "${friendly_name} Common Alarm"
      id: bs_alarm
    common_warning:
      name: "${friendly_name} Common Warning"
      id: bs_warning
      on_state:
        then:
          - if:
              condition:
                binary_sensor.is_on: bs_shutdown
              then:
                - lvgl.label.update:
                    id: lbl_alarm_status
                    text: "SHUTDOWN ACTIVE"
                    text_color: 0xef4444
              else:
                - if:
                    condition:
                      binary_sensor.is_on: bs_warning
                    then:
                      - lvgl.label.update:
                          id: lbl_alarm_status
                          text: "WARNING ACTIVE"
                          text_color: 0xf59e0b
                    else:
                      - lvgl.label.update:
                          id: lbl_alarm_status
                          text: "All Normal"
                          text_color: 0x22c55e
    common_shutdown:
      name: "${friendly_name} Common Shutdown"
      id: bs_shutdown
      on_state:
        then:
          - if:
              condition:
                binary_sensor.is_on: bs_shutdown
              then:
                - lvgl.label.update:
                    id: lbl_alarm_status
                    text: "SHUTDOWN ACTIVE"
                    text_color: 0xef4444
              else:
                - if:
                    condition:
                      binary_sensor.is_on: bs_warning
                    then:
                      - lvgl.label.update:
                          id: lbl_alarm_status
                          text: "WARNING ACTIVE"
                          text_color: 0xf59e0b
                    else:
                      - lvgl.label.update:
                          id: lbl_alarm_status
                          text: "All Normal"
                          text_color: 0x22c55e

    # --- Operating Modes ---
    in_auto_mode:
      name: "${friendly_name} Auto Mode"
      id: bs_auto
    in_manual_mode:
      name: "${friendly_name} Manual Mode"
      id: bs_manual
    in_stop_mode:
      name: "${friendly_name} Stop Mode"
      id: bs_stop

    # --- Emergency ---
    emergency_stop:
      name: "${friendly_name} Emergency Stop"
      id: bs_estop

    # --- Shutdown Alarms ---
    overspeed_shutdown:
      name: "${friendly_name} Overspeed Shutdown"
      id: bs_overspeed_sd
    gen_overvoltage_shutdown:
      name: "${friendly_name} Overvoltage Shutdown"
      id: bs_overvolt_sd
    gen_undervoltage_shutdown:
      name: "${friendly_name} Undervoltage Shutdown"
      id: bs_undervolt_sd
    gen_overcurrent_shutdown:
      name: "${friendly_name} Overcurrent Shutdown"
      id: bs_overcurrent_sd
    crank_failure_shutdown:
      name: "${friendly_name} Crank Failure Shutdown"
      id: bs_crank_fail
    high_temp_shutdown:
      name: "${friendly_name} High Temp Shutdown"
      id: bs_hightemp_sd
    low_oil_pressure_shutdown:
      name: "${friendly_name} Low Oil Pressure Shutdown"
      id: bs_lowoil_sd

    # --- Warnings ---
    high_temp_warning:
      name: "${friendly_name} High Temp Warning"
      id: bs_hightemp_warn
    low_oil_pressure_warning:
      name: "${friendly_name} Low Oil Pressure Warning"
      id: bs_lowoil_warn
    charging_failure_warning:
      name: "${friendly_name} Charging Failure Warning"
      id: bs_charge_fail
    battery_undervoltage_warning:
      name: "${friendly_name} Battery Undervoltage Warning"
      id: bs_batt_low
    stop_failure_warning:
      name: "${friendly_name} Stop Failure Warning"
      id: bs_stop_fail

# ============================================================
#  Control Buttons (platform: smartgen_hsc941)
#  IDs are for LVGL button binding in later tasks
# ============================================================
button:
  - platform: smartgen_hsc941
    smartgen_hsc941_id: genset

    engine_start:
      name: "${friendly_name} Engine Start"
      id: btn_start
    engine_stop:
      name: "${friendly_name} Engine Stop"
      id: btn_stop
    engine_auto:
      name: "${friendly_name} Set Auto Mode"
      id: btn_auto
    engine_manual:
      name: "${friendly_name} Set Manual Mode"
      id: btn_manual
    gen_switch_on:
      name: "${friendly_name} Transfer Switch ON"
      id: btn_xfer_on
    gen_switch_off:
      name: "${friendly_name} Transfer Switch OFF"
      id: btn_xfer_off
    fault_reset:
      name: "${friendly_name} Fault Reset"
      id: btn_fault_reset

# ============================================================
#  LVGL Interface — Dark Theme Tabview Shell
# ============================================================
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  # ---------- style definitions ----------
  style_definitions:
    - id: style_card
      bg_color: 0x1a1e2b
      border_color: 0x252a3a
      border_width: 1
      radius: 10
      pad_all: 10

    - id: style_card_header
      text_color: 0x6b7394
      text_font: montserrat_14

    - id: style_value
      text_color: 0xdee2ec
      text_font: montserrat_28

    - id: style_value_small
      text_color: 0xdee2ec
      text_font: montserrat_18

    - id: style_dim
      text_color: 0x6b7394
      text_font: montserrat_14

    - id: style_label_row_key
      text_color: 0x6b7394
      text_font: montserrat_14

    - id: style_label_row_val
      text_color: 0xdee2ec
      text_font: montserrat_16

  # ---------- top-level configuration ----------
  top_layer:
    widgets:
      # ---- Status Bar ----
      - obj:
          width: 1024
          height: 36
          x: 0
          y: 0
          bg_color: 0x141720
          bg_opa: COVER
          border_color: 0x252a3a
          border_width: 1
          border_side: BOTTOM
          pad_left: 12
          pad_right: 12
          radius: 0
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
          widgets:
            # Left: title
            - label:
                text: "HSC941 Generator"
                text_color: 0xdee2ec
                text_font: montserrat_16
            # Right: badges container
            - obj:
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                bg_opa: TRANSP
                pad_column: 6
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                widgets:
                  - label:
                      id: lbl_conn_badge
                      text: "OFFLINE"
                      text_color: 0xef4444
                      text_font: montserrat_12
                  - label:
                      id: lbl_mode_badge
                      text: "---"
                      text_color: 0x6b7394
                      text_font: montserrat_12

  # ---------- pages ----------
  pages:
    - id: main_page
      bg_color: 0x0c0e14
      bg_opa: COVER
      pad_all: 0
      widgets:
        - tabview:
            id: main_tabs
            width: 1024
            height: 564
            y: 36
            position: TOP
            size: 40
            bg_color: 0x0c0e14
            bg_opa: COVER
            tab_style:
              text_font: montserrat_14
              text_color: 0x6b7394
            tab_selected_style:
              text_color: 0x3b82f6
            tabs:
              - name: "Monitor"
                id: tab_monitor
                bg_color: 0x0c0e14
                bg_opa: COVER
                widgets:
                  # ---- Arc Gauges Row ----
                  - obj:
                      width: 100%
                      height: 260
                      bg_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                      widgets:
                        # -- Voltage Gauge Card --
                        - obj:
                            styles: style_card
                            width: 235
                            height: 244
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - arc:
                                  id: arc_voltage
                                  width: 140
                                  height: 140
                                  min_value: 0
                                  max_value: 300
                                  value: 0
                                  adjustable: false
                                  arc_width: 10
                                  arc_color: 0x3b82f6
                                  indicator:
                                    arc_width: 10
                                    arc_color: 0x3b82f6
                                  knob:
                                    bg_opa: TRANSP
                                  main:
                                    arc_width: 10
                                    arc_color: 0x1e2235
                                  widgets:
                                    - label:
                                        id: lbl_voltage_val
                                        styles: style_value
                                        text: "---"
                                        align: CENTER
                                    - label:
                                        id: lbl_voltage_unit
                                        styles: style_dim
                                        text: "V"
                                        align: CENTER
                                        y: 20
                              - label:
                                  styles: style_card_header
                                  text: "Voltage"
                        # -- Frequency Gauge Card --
                        - obj:
                            styles: style_card
                            width: 235
                            height: 244
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - arc:
                                  id: arc_frequency
                                  width: 140
                                  height: 140
                                  min_value: 0
                                  max_value: 6500
                                  value: 0
                                  adjustable: false
                                  arc_width: 10
                                  arc_color: 0x22c55e
                                  indicator:
                                    arc_width: 10
                                    arc_color: 0x22c55e
                                  knob:
                                    bg_opa: TRANSP
                                  main:
                                    arc_width: 10
                                    arc_color: 0x1e2235
                                  widgets:
                                    - label:
                                        id: lbl_freq_val
                                        styles: style_value
                                        text: "---"
                                        align: CENTER
                                    - label:
                                        id: lbl_freq_unit
                                        styles: style_dim
                                        text: "Hz"
                                        align: CENTER
                                        y: 20
                              - label:
                                  styles: style_card_header
                                  text: "Frequency"
                        # -- RPM Gauge Card --
                        - obj:
                            styles: style_card
                            width: 235
                            height: 244
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - arc:
                                  id: arc_rpm
                                  width: 140
                                  height: 140
                                  min_value: 0
                                  max_value: 2000
                                  value: 0
                                  adjustable: false
                                  arc_width: 10
                                  arc_color: 0xf59e0b
                                  indicator:
                                    arc_width: 10
                                    arc_color: 0xf59e0b
                                  knob:
                                    bg_opa: TRANSP
                                  main:
                                    arc_width: 10
                                    arc_color: 0x1e2235
                                  widgets:
                                    - label:
                                        id: lbl_rpm_val
                                        styles: style_value
                                        text: "---"
                                        align: CENTER
                                    - label:
                                        id: lbl_rpm_unit
                                        styles: style_dim
                                        text: "RPM"
                                        align: CENTER
                                        y: 20
                              - label:
                                  styles: style_card_header
                                  text: "RPM"
                        # -- Load Gauge Card --
                        - obj:
                            styles: style_card
                            width: 235
                            height: 244
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - arc:
                                  id: arc_load
                                  width: 140
                                  height: 140
                                  min_value: 0
                                  max_value: 100
                                  value: 0
                                  adjustable: false
                                  arc_width: 10
                                  arc_color: 0x06b6d4
                                  indicator:
                                    arc_width: 10
                                    arc_color: 0x06b6d4
                                  knob:
                                    bg_opa: TRANSP
                                  main:
                                    arc_width: 10
                                    arc_color: 0x1e2235
                                  widgets:
                                    - label:
                                        id: lbl_load_val
                                        styles: style_value
                                        text: "---"
                                        align: CENTER
                                    - label:
                                        id: lbl_load_unit
                                        styles: style_dim
                                        text: "%"
                                        align: CENTER
                                        y: 20
                              - label:
                                  styles: style_card_header
                                  text: "Load"
                  # ---- Bottom Data Row (Engine / Fuel / Alarms) ----
                  - obj:
                      width: 100%
                      height: 230
                      bg_opa: TRANSP
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: START
                        pad_column: 8
                      widgets:
                        # -- Engine Card --
                        - obj:
                            styles: style_card
                            flex_grow: 1
                            height: 220
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_cross: STRETCH
                            widgets:
                              - label:
                                  styles: style_card_header
                                  text: "ENGINE"
                              # Water Temp row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Water Temp"
                                    - label:
                                        id: lbl_wt
                                        styles: style_label_row_val
                                        text: "-- °C"
                              # Oil Pressure row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Oil Pressure"
                                    - label:
                                        id: lbl_op
                                        styles: style_label_row_val
                                        text: "-- kPa"
                              # Battery row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Battery"
                                    - label:
                                        id: lbl_batt
                                        styles: style_label_row_val
                                        text: "-- V"
                              # Charge row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Charge"
                                    - label:
                                        id: lbl_chg
                                        styles: style_label_row_val
                                        text: "-- V"
                              # Total Hours row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Total Hours"
                                    - label:
                                        id: lbl_hours
                                        styles: style_label_row_val
                                        text: "-- h"
                              # Total Starts row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Total Starts"
                                    - label:
                                        id: lbl_starts
                                        styles: style_label_row_val
                                        text: "--"
                        # -- Fuel Card --
                        - obj:
                            styles: style_card
                            flex_grow: 1
                            height: 220
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_cross: CENTER
                            widgets:
                              - label:
                                  styles: style_card_header
                                  text: "FUEL"
                              - label:
                                  id: lbl_fuel_pct
                                  text: "--%"
                                  text_color: 0x22c55e
                                  text_font: montserrat_36
                                  align: CENTER
                              - bar:
                                  id: bar_fuel
                                  width: 100%
                                  height: 18
                                  min_value: 0
                                  max_value: 100
                                  value: 0
                                  bg_color: 0x1e2235
                                  radius: 9
                                  indicator:
                                    bg_color: 0x22c55e
                                    radius: 9
                              # Remaining row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Remaining"
                                    - label:
                                        id: lbl_fuel_remain
                                        styles: style_label_row_val
                                        text: "-- L"
                              # Est. Runtime row
                              - obj:
                                  height: 22
                                  width: 100%
                                  bg_opa: TRANSP
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        styles: style_label_row_key
                                        text: "Est. Runtime"
                                    - label:
                                        id: lbl_fuel_runtime
                                        styles: style_label_row_val
                                        text: "-- h"
                        # -- Alarms Card --
                        - obj:
                            styles: style_card
                            flex_grow: 1
                            height: 220
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_cross: CENTER
                            widgets:
                              - label:
                                  styles: style_card_header
                                  text: "ALARMS"
                              - label:
                                  id: lbl_alarm_status
                                  text: "All Normal"
                                  text_color: 0x22c55e
                                  text_font: montserrat_18
                                  align: CENTER
                                  pad_top: 20
              - name: "Controls"
                id: tab_controls
                bg_color: 0x0c0e14
                bg_opa: COVER
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_cross: CENTER
                pad_all: 16
                pad_row: 16
                widgets:
                  # ---- ENGINE Section ----
                  - label:
                      styles: style_card_header
                      text: "ENGINE"
                      width: 500
                  - obj:
                      width: 500
                      height: 80
                      bg_opa: TRANSP
                      pad_column: 12
                      layout:
                        type: FLEX
                        flex_flow: ROW
                      widgets:
                        - button:
                            id: lv_btn_start
                            flex_grow: 1
                            height: 100%
                            bg_color: 0x16a34a
                            radius: 10
                            on_press:
                              then:
                                - button.press: btn_start
                            widgets:
                              - label:
                                  text: "START"
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text_font: montserrat_20
                        - button:
                            id: lv_btn_stop
                            flex_grow: 1
                            height: 100%
                            bg_color: 0xdc2626
                            radius: 10
                            on_press:
                              then:
                                - button.press: btn_stop
                            widgets:
                              - label:
                                  text: "STOP"
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text_font: montserrat_20
                  # ---- MODE Section ----
                  - label:
                      styles: style_card_header
                      text: "MODE"
                      width: 500
                  - obj:
                      width: 500
                      height: 80
                      bg_opa: TRANSP
                      pad_column: 12
                      layout:
                        type: FLEX
                        flex_flow: ROW
                      widgets:
                        - button:
                            id: lv_btn_auto
                            flex_grow: 1
                            height: 100%
                            bg_color: 0x2563eb
                            radius: 10
                            on_press:
                              then:
                                - button.press: btn_auto
                            widgets:
                              - label:
                                  text: "AUTO"
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text_font: montserrat_20
                        - button:
                            id: lv_btn_manual
                            flex_grow: 1
                            height: 100%
                            bg_color: 0xd97706
                            radius: 10
                            on_press:
                              then:
                                - button.press: btn_manual
                            widgets:
                              - label:
                                  text: "MANUAL"
                                  align: CENTER
                                  text_color: 0x000000
                                  text_font: montserrat_20
                  # ---- TRANSFER SWITCH Section ----
                  - label:
                      styles: style_card_header
                      text: "TRANSFER SWITCH"
                      width: 500
                  - obj:
                      width: 500
                      height: 80
                      bg_opa: TRANSP
                      pad_column: 12
                      layout:
                        type: FLEX
                        flex_flow: ROW
                      widgets:
                        - button:
                            id: lv_btn_xfer_on
                            flex_grow: 1
                            height: 100%
                            bg_color: 0x0d9488
                            radius: 10
                            on_press:
                              then:
                                - button.press: btn_xfer_on
                            widgets:
                              - label:
                                  text: "ON"
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text_font: montserrat_20
                        - button:
                            id: lv_btn_xfer_off
                            flex_grow: 1
                            height: 100%
                            bg_color: 0x9f1239
                            radius: 10
                            on_press:
                              then:
                                - button.press: btn_xfer_off
                            widgets:
                              - label:
                                  text: "OFF"
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text_font: montserrat_20
                  # ---- FAULT RESET Button ----
                  - button:
                      id: lv_btn_fault_reset
                      width: 500
                      height: 70
                      bg_color: 0x7c3aed
                      radius: 10
                      on_press:
                        then:
                          - button.press: btn_fault_reset
                      widgets:
                        - label:
                            text: "FAULT RESET"
                            align: CENTER
                            text_color: 0xFFFFFF
                            text_font: montserrat_20
              - name: "History"
                id: tab_history
                bg_color: 0x0c0e14
                bg_opa: COVER
                widgets:
                  - label:
                      text: "History — coming soon"
                      text_color: 0x6b7394
                      text_font: montserrat_18
                      align: CENTER

# ============================================================
#  Interval — Status Bar Updates
# ============================================================
interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              auto *hub = id(genset);
              return hub->is_connected();
          then:
            - lvgl.label.update:
                id: lbl_conn_badge
                text: "CONNECTED"
                text_color: 0x22c55e
          else:
            - lvgl.label.update:
                id: lbl_conn_badge
                text: "DISCONNECTED"
                text_color: 0xef4444
      - if:
          condition:
            binary_sensor.is_on: bs_auto
          then:
            - lvgl.label.update:
                id: lbl_mode_badge
                text: "AUTO"
                text_color: 0x3b82f6
          else:
            - if:
                condition:
                  binary_sensor.is_on: bs_manual
                then:
                  - lvgl.label.update:
                      id: lbl_mode_badge
                      text: "MANUAL"
                      text_color: 0xf59e0b
                else:
                  - lvgl.label.update:
                      id: lbl_mode_badge
                      text: "STOP"
                      text_color: 0xef4444

# SmartGen HSC941 Generator Controller - ESP32-P4 Waveshare 10.1" Display
# ESPHome configuration for LVGL touchscreen interface over RS485
#
# Board: ESP32-P4 with MIPI DSI 1024x600 display, GT911 touch, ESP32-C6 WiFi

substitutions:
  device_name: smartgen-hsc941-display
  friendly_name: "Generator"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-p4-evboard
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# WiFi via ESP32-C6 co-processor (SDIO)
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  slot: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

# I2C bus for touchscreen
i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8

# LDO for MIPI DSI PHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# Load the SmartGen HSC941 component from local directory
external_components:
  - source:
      type: local
      path: components

# ============================================================
#  MIPI DSI Display (Waveshare 10.1" 1024x600)
# ============================================================
display:
  - platform: mipi_dsi
    dimensions:
      width: 1024
      height: 600
    hsync_pulse_width: 40
    hsync_front_porch: 40
    hsync_back_porch: 140
    vsync_pulse_width: 4
    vsync_front_porch: 16
    vsync_back_porch: 16
    id: my_display
    model: WAVESHARE-P4-NANO-10.1
    reset_pin: GPIO33
    init_sequence:
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11]
      - delay 120ms

# ============================================================
#  GT911 Capacitive Touchscreen
# ============================================================
touchscreen:
  - platform: gt911
    id: my_touchscreen

# ============================================================
#  Backlight (LEDC PWM)
# ============================================================
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# ============================================================
#  SmartGen HSC941 Controller Hub (RS485)
# ============================================================
smartgen_hsc941:
  id: genset
  address: 1
  baud_rate: 9600
  tx_pin: GPIO26
  rx_pin: GPIO27
  uart_num: 1
  update_interval: 5s

# ============================================================
#  Sensors (platform: smartgen_hsc941)
#  IDs are for LVGL widget binding in later tasks
# ============================================================
sensor:
  - platform: smartgen_hsc941
    smartgen_hsc941_id: genset

    gen_voltage_a:
      name: "${friendly_name} Voltage"
      id: sen_voltage
    gen_frequency:
      name: "${friendly_name} Frequency"
      id: sen_frequency
    engine_speed:
      name: "${friendly_name} Engine Speed"
      id: sen_rpm
    output_load_percent:
      name: "${friendly_name} Output Load"
      id: sen_load
    water_temperature:
      name: "${friendly_name} Coolant Temperature"
      id: sen_water_temp
    oil_pressure:
      name: "${friendly_name} Oil Pressure"
      id: sen_oil_pressure
    battery_voltage:
      name: "${friendly_name} Battery Voltage"
      id: sen_battery
    charge_voltage:
      name: "${friendly_name} D+ Charge Voltage"
      id: sen_charge
    engine_total_hours:
      name: "${friendly_name} Total Running Hours"
      id: sen_total_hours
    total_start_times:
      name: "${friendly_name} Total Starts"
      id: sen_total_starts
    total_active_power:
      name: "${friendly_name} Total Active Power"
      id: sen_power
    power_factor:
      name: "${friendly_name} Power Factor"
      id: sen_pf

# ============================================================
#  Binary Sensors (platform: smartgen_hsc941)
#  IDs are for LVGL indicator binding in later tasks
# ============================================================
binary_sensor:
  - platform: smartgen_hsc941
    smartgen_hsc941_id: genset

    # --- Summary Alarms ---
    common_alarm:
      name: "${friendly_name} Common Alarm"
      id: bs_alarm
    common_warning:
      name: "${friendly_name} Common Warning"
      id: bs_warning
    common_shutdown:
      name: "${friendly_name} Common Shutdown"
      id: bs_shutdown

    # --- Operating Modes ---
    in_auto_mode:
      name: "${friendly_name} Auto Mode"
      id: bs_auto
    in_manual_mode:
      name: "${friendly_name} Manual Mode"
      id: bs_manual
    in_stop_mode:
      name: "${friendly_name} Stop Mode"
      id: bs_stop

    # --- Emergency ---
    emergency_stop:
      name: "${friendly_name} Emergency Stop"
      id: bs_estop

    # --- Shutdown Alarms ---
    overspeed_shutdown:
      name: "${friendly_name} Overspeed Shutdown"
      id: bs_overspeed_sd
    gen_overvoltage_shutdown:
      name: "${friendly_name} Overvoltage Shutdown"
      id: bs_overvolt_sd
    gen_undervoltage_shutdown:
      name: "${friendly_name} Undervoltage Shutdown"
      id: bs_undervolt_sd
    gen_overcurrent_shutdown:
      name: "${friendly_name} Overcurrent Shutdown"
      id: bs_overcurrent_sd
    crank_failure_shutdown:
      name: "${friendly_name} Crank Failure Shutdown"
      id: bs_crank_fail
    high_temp_shutdown:
      name: "${friendly_name} High Temp Shutdown"
      id: bs_hightemp_sd
    low_oil_pressure_shutdown:
      name: "${friendly_name} Low Oil Pressure Shutdown"
      id: bs_lowoil_sd

    # --- Warnings ---
    high_temp_warning:
      name: "${friendly_name} High Temp Warning"
      id: bs_hightemp_warn
    low_oil_pressure_warning:
      name: "${friendly_name} Low Oil Pressure Warning"
      id: bs_lowoil_warn
    charging_failure_warning:
      name: "${friendly_name} Charging Failure Warning"
      id: bs_charge_fail
    battery_undervoltage_warning:
      name: "${friendly_name} Battery Undervoltage Warning"
      id: bs_batt_low
    stop_failure_warning:
      name: "${friendly_name} Stop Failure Warning"
      id: bs_stop_fail

# ============================================================
#  Control Buttons (platform: smartgen_hsc941)
#  IDs are for LVGL button binding in later tasks
# ============================================================
button:
  - platform: smartgen_hsc941
    smartgen_hsc941_id: genset

    engine_start:
      name: "${friendly_name} Engine Start"
      id: btn_start
    engine_stop:
      name: "${friendly_name} Engine Stop"
      id: btn_stop
    engine_auto:
      name: "${friendly_name} Set Auto Mode"
      id: btn_auto
    engine_manual:
      name: "${friendly_name} Set Manual Mode"
      id: btn_manual
    gen_switch_on:
      name: "${friendly_name} Transfer Switch ON"
      id: btn_xfer_on
    gen_switch_off:
      name: "${friendly_name} Transfer Switch OFF"
      id: btn_xfer_off
    fault_reset:
      name: "${friendly_name} Fault Reset"
      id: btn_fault_reset
